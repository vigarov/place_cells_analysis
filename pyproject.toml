[project]
name = "place-cells-analysis"
version = "0.1.0"
description = "Recurrent autoencoder model of hippocampal place cells (Wang et al., NeurIPS 2024)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ax-platform[notebook]>=1.3.1",
    "botorch>=0.18.1",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "plotly>=6.8.0",
    "pot>=0.9.7",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "torch>=2.9.1",
    "torch-shampoo>=1.0.0",
    "tqdm>=4.67.3",
]

[project.scripts]
generate-room = "trajectories.generate_room:main"
generate-oldcycles-rooms = "scripts.generate_oldcycles_rooms:main"
old-cycles-experiment = "scripts.old_cycles_experiment:main"
cycles-experiment = "scripts.old_cycles_experiment:main"
recreate-paper-plots-cycles = "scripts.recreate_paper_plots_cycles:main"
truncate-cycles-results = "experiments.old_cycles.truncate_cycles_results:main"
estimate-gaussians-rf = "scripts.estimate_gaussians_rf:main"
benchmark-step-size = "scripts.benchmark_step_size:main"
generate-experiment-room = "scripts.generate_experiment_room:main"
run-experiment = "scripts.run_experiment:main"
bayesian-opt-hyperparam = "scripts.bayesian_opt_hyperparam:main"

[build-system]
requires = ["setuptools >= 64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "analysis",
    "core",
    "experiments",
    "experiments.common",
    "experiments.old_cycles",
    "experiments.single_room",
    "experiments.two_rooms",
    "experiments.many_rooms",
    "optimizers",
    "trajectories",
    "models",
    "nn4n",
    "nn4n.nn",
    "scripts",
]

[tool.setuptools.package-dir]
"" = "src"
"nn4n" = "src/models/nn4n"
"scripts" = "scripts"

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
]
torch-shampoo = { git = "https://github.com/facebookresearch/optimizers.git", rev = "23b6ba547156ed5a3dd68a6f543e4858ed6ffbf6" }
